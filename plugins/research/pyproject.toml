[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-paper-search"
version = "0.3.1"
description = "Venue-first AI paper discovery with semantic query variants and validated BibTeX"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Junwon Ko" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "mcp>=1.27,<2",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "respx>=0.21,<1"]

[project.scripts]
ai-paper-search = "ai_paper_search.cli:main"
ai-paper-bibtex = "ai_paper_search.bibtex_cli:main"
ai-paper-search-mcp = "ai_paper_search.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_paper_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
